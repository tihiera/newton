[project]
name = "newton-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/agentd", "services/worker"]

[tool.uv.sources]
newton-agentd = { workspace = true }
newton-worker = { workspace = true }

[dependency-groups]
dev = [
    "newton-agentd",
    "newton-worker",
    "numpy>=2.0",
    "matplotlib>=3.9",
    # The local runner uses this venv: the Apple GPU backend (metal) needs MLX.
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-xdist>=3.8.0",
    "openai>=3.23.0",
    "mlx-lm>=0.28 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S101",  # assert in tests
    "S603",  # subprocess without shell: argv lists are our policy
    "S607",  # partial executable path (ssh, nvidia-smi)
    "UP007", "UP045",  # worker must stay py3.9-compatible: keep Optional[]
    "SIM105",  # explicit try/except pass reads fine
]

[tool.ruff.lint.per-file-ignores]
"services/agentd/**" = ["UP"]
"**/tests/**" = ["S105", "S106", "S108", "S310", "F811"]  # F811: imported pytest fixtures

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["services/agentd/newton_agentd", "services/worker/newton_worker", "benchmarks"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cupy", "cupy.*", "matplotlib", "matplotlib.*", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/agentd/tests", "services/worker/tests", "benchmarks"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires a real SSH host (NEWTON_TEST_SSH_HOST)"]
addopts = "-m 'not live'"
