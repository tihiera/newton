[project]
name = "newton-agentd"
version = "0.1.0"
description = "Newton macOS control-plane daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "keyring>=25",
    "pypdf>=5",
]

[project.scripts]
newton-agentd = "newton_agentd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newton_agentd"]
