[project]
name = "newton-agentd"
version = "0.1.0"
description = "Newton macOS control-plane daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "keyring>=25",
    "pypdf>=5",
]

[project.optional-dependencies]
# What running Newton on a Mac adds (scripts/setup.sh: uv sync --all-packages --extra
# mac): the local CPU runner (numpy, matplotlib for plots), the Apple GPU backend (mlx)
# and Mac-served models (mlx-lm, huggingface_hub). The dev venv also gets them from the
# root dev group.
mac = [
    "numpy>=2,<2.6",
    "matplotlib>=3.9",
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
newton-agentd = "newton_agentd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newton_agentd"]
